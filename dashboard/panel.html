<style>
/* Las variables son las mismas del dashboard: el panel tiene que verse como
   parte del producto, no como otra aplicación. */
:root{
  --bg:#0f172a; --bg2:#1e293b; --bg3:#273549;
  --card:#1e293b; --card2:#253347;
  --border:#334155; --border2:#3d5068;
  --text:#f1f5f9; --muted:#94a3b8; --muted2:#64748b;
  --primary:#6366f1; --primary-dim:rgba(99,102,241,.15);
  --green:#10b981; --green-dim:rgba(16,185,129,.15);
  --orange:#f59e0b; --orange-dim:rgba(245,158,11,.15);
  --red:#ef4444; --red-dim:rgba(239,68,68,.14);
  --blue:#3b82f6; --blue-dim:rgba(59,130,246,.15);
  --radius:14px; --radius-sm:9px;
  --shadow:0 4px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f1f5f9; --bg2:#fff; --bg3:#e2e8f0;
  --card:#fff; --card2:#f8fafc;
  --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --shadow:0 4px 20px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;
     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.top h1 i{color:var(--primary)}
.top .sp{flex:1}
.btn{background:var(--card);border:1px solid var(--border);color:var(--text);
     border-radius:var(--radius-sm);padding:7px 11px;font-size:12px;cursor:pointer;
     display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--card2)}
.sello{font-size:11px;color:var(--muted)}

/* 1 columna en teléfono, 2 desde 680px, 3 desde 1040px solo cuando hay 5 o 6.
   Con 4 quedan 2x2; con 6, 3x2; con 3, dos arriba y una abajo a ancho completo,
   que se lee mejor que tres apretadas. No se pasa a 3 columnas con 4 o menos:
   el recuadro se angosta sin necesidad y el gauge pierde tamaño. */
.rejilla{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:680px){ .rejilla{grid-template-columns:repeat(2,1fr)} }
@media(min-width:1040px){ .rejilla.n5, .rejilla.n6{grid-template-columns:repeat(3,1fr)} }
.rejilla.n1{grid-template-columns:1fr;max-width:520px}
@media(min-width:680px){ .rejilla.n3 > .tile:last-child{grid-column:1 / -1} }

.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:13px;display:flex;flex-direction:column;gap:10px;
      cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:var(--primary)}
.t-hdr{display:flex;align-items:flex-start;gap:8px}
.t-nom{font-size:14px;font-weight:700;line-height:1.2}
.t-mac{font-size:10px;color:var(--muted2);font-family:ui-monospace,monospace;letter-spacing:.3px}
.t-chips{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;white-space:nowrap}

/* Visores: gauge y dígito, lado a lado como en el dashboard */
.visores{display:flex;align-items:center;gap:12px}
.g-wrap{position:relative;width:132px;flex:none}
.g-svg{width:132px;display:block}
.g-over{position:absolute;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:flex-end;padding-bottom:4px}
.g-pct{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.g-est{font-size:9px;font-weight:700;margin-top:1px}
.digital{flex:1;text-align:center;border-left:1px solid var(--border2);padding-left:12px}
.d-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.d-num{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;
       color:var(--primary);margin-top:1px}
/* Sin lectura el guion iba del mismo morado y tamaño que una cifra: se leía
   como una barra de color, no como «no hay dato». */
.d-num.mudo{color:var(--muted2);font-size:22px}
.d-num small{font-size:13px;color:var(--muted);font-weight:700;margin-left:2px}
.d-sub{font-size:9px;color:var(--muted);margin-top:2px}

/* Gráfico diario: barras SVG propias. Cuatro instancias de Chart.js en una
   página es peso y memoria por un gráfico de catorce barras sin interacción. */
.graf{border-top:1px solid var(--border2);padding-top:9px}
.graf-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.graf-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.graf-med{font-size:10px;color:var(--muted)}
.graf svg{width:100%;display:block}
.graf-pie{display:flex;justify-content:space-between;font-size:9px;color:var(--muted2);margin-top:3px}

.ok{color:var(--green)}     .warn{color:var(--orange)}    .danger{color:var(--red)}
.c-ok{background:var(--green-dim);color:var(--green)}
.c-warn{background:var(--orange-dim);color:var(--orange)}
.c-bad{background:var(--red-dim);color:var(--red)}
.c-mute{background:var(--bg3);color:var(--muted)}
.aviso{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
       padding:26px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.aviso i{font-size:26px;color:var(--muted2);display:block;margin-bottom:10px}
.aviso b{color:var(--text)}
</style>

<body>
<div class="wrap">
  <div class="top">
    <h1><i class="fas fa-layer-group"></i> Panel de cilindros</h1>
    <div class="sp"></div>
    <span class="sello" id="sello">—</span>
    <button class="btn" onclick="cambiarTema()"><i class="fas fa-moon" id="ico-tema"></i></button>
    <button class="btn" onclick="cargar()"><i class="fas fa-rotate"></i> Actualizar</button>
  </div>
  <div id="contenido"><div class="aviso"><i class="fas fa-spinner fa-spin"></i>Cargando…</div></div>
</div>

<script>
const SUPABASE_URL      = "https://uooftjtllmsnugdcldvc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uh1UiFUzu2mBDUGvBIR5dA_YQ3C5XBW";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MAX_TILES   = 6;        // 3x2 en escritorio desde 1040px
/* Un equipo que no reporta hace más de esto lleva un chip de aviso. El grid del
   temporizador es de 15,05 min, así que 2 h son ocho ciclos perdidos: ya no es
   un tropiezo de wifi. */
const SIN_REPORTE_AVISO_MS = 2 * 3600 * 1000;
const SIN_REPORTE_GRAVE_MS = 48 * 3600 * 1000;
const DIAS_GRAF   = 14;
const REFRESCO_MS = 60000;
const ARC         = Math.PI * 80;

/* ═══════════════════════════════════════════════════════════════════════
   NÚCLEO DE MEDICIÓN — copiado literal de index.html por construir-panel.js.
   NO EDITAR AQUÍ. Se edita en index.html y se vuelve a generar el panel;
   t/p34.js falla si los dos archivos dejan de coincidir byte a byte.
   ═══════════════════════════════════════════════════════════════════════ */
const LECTURA_MIN_KG = 0.001;
const LECTURA_MAX_KG = 200;
const CILINDRO_MIN_FACTOR = 0.9;
const PICO_MIN_KG = 0.15;
const VALLE_MIN_KG = 0.15;
const BAJO_TARA_FILAS = 2;
function _fechaUTC(iso){
    if (iso instanceof Date) return iso;
    let s = String(iso == null ? '' : iso).replace(' ', 'T');
    if (!s.endsWith('Z') && !/[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
    return new Date(s);
}
function toChileDate(iso) {
    let s = iso.replace(' ', 'T');
    if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
    const utc = new Date(s);
    const fmt = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Santiago',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
    });
    const p = fmt.formatToParts(utc)
                 .reduce((acc,{type,value}) => ({...acc,[type]:parseInt(value||0)}), {});
    return new Date(Date.UTC(p.year, p.month-1, p.day, p.hour, p.minute, p.second));
}
function pad(n){ return String(n).padStart(2, '0'); }
function _lecturaPlausible(w){
    return Number.isFinite(w) && w >= LECTURA_MIN_KG && w <= LECTURA_MAX_KG;
}
function _esPicoTransitorio(bPrev, bCur, bNext){
    if (bPrev === null || bCur === null || bNext === null) return false;
    const sobresale = bCur - Math.max(bPrev, bNext);   // cuanto se despega del nivel
    if (sobresale < PICO_MIN_KG) return false;
    const escalon = Math.abs(bPrev - bNext);           // cambio real de nivel alrededor
    return escalon < sobresale;                        // vecinas parecidas ⇒ es un pico
}
function _esValleTransitorio(bPrev, bCur, bNext){
    if (bPrev === null || bCur === null || bNext === null) return false;
    const hunde = Math.min(bPrev, bNext) - bCur;       // cuanto se hunde bajo el nivel
    if (hunde < VALLE_MIN_KG) return false;
    const escalon = Math.abs(bPrev - bNext);           // cambio real de nivel alrededor
    return escalon < hunde;                            // vecinas parecidas ⇒ es un valle
}
function _serieValida(rows, tara){
    const base = (rows || []).filter(r => _netoDe(r, tara) !== null);
    if (base.length < 3) return base;
    const b = base.map(r => _brutoDe(r, tara));
    return base.filter((r, i) => i === 0 || i === base.length - 1
                              || !(_esPicoTransitorio(b[i-1], b[i], b[i+1])
                                || _esValleTransitorio(b[i-1], b[i], b[i+1])));   // [p26]
}
function _brutoDe(row, tara){
    const w = parseFloat(row?.weight);
    if (!_lecturaPlausible(w)) return null;             // -999, NaN, 0.0, absurdos
    const e = parseFloat(row?.empty_weight);
    const bruto = (Number.isFinite(e) && e > 0) ? w + e : w;   // e>0 ⇒ la lectura venía neta
    if (!_lecturaPlausible(bruto)) return null;
    const t = parseFloat(tara);
    if (Number.isFinite(t) && t > 0 && bruto < t * CILINDRO_MIN_FACTOR) return null;
    return bruto;
}
function _netoDe(row, tara){
    const bruto = _brutoDe(row, tara);
    if (bruto === null) return null;
    const t = Number.isFinite(parseFloat(tara)) ? parseFloat(tara) : 0;
    return Math.max(0, bruto - t);
}
function _ultimaValida(filas, tara){
    if (!Array.isArray(filas)) return null;
    for (const f of filas) if (_netoDe(f, tara) !== null) return f;
    return null;
}
function _bajoLaTara(filas, tara){
    const t = parseFloat(tara);
    if (!(Number.isFinite(t) && t > 0)) return false;          // tara sin configurar
    if (!Array.isArray(filas) || filas.length < BAJO_TARA_FILAS) return false;
    for (let i = 0; i < BAJO_TARA_FILAS; i++){
        const w = parseFloat(filas[i]?.weight);
        if (!Number.isFinite(w) || w <= -900) return false;    // fallo del sensor
        const e = parseFloat(filas[i]?.empty_weight);
        const bruto = (Number.isFinite(e) && e > 0) ? w + e : w;
        if (bruto < 0 || bruto > LECTURA_MAX_KG) return false; // absurdo
        if (bruto > t) return false;                           // hay cilindro con gas
    }
    return true;
}
/* ═══════════════════════ fin del núcleo de medición ═══════════════════════ */

/* ── Qué básculas se muestran ───────────────────────────────────────────────
   `lg_basculas` es el registro local que creó p12: se alimenta solo cada vez
   que se abre una báscula por su QR. `?equipos=MAC,MAC` permite armar el panel
   sin haber abierto cada una antes, que es lo que necesita una oficina. */
const LG_REGISTRO = 'lg_basculas';
function lgBasculas(){
    try {
        const a = JSON.parse(localStorage.getItem(LG_REGISTRO) || '[]');
        const l = Array.isArray(a) ? a.filter(b => b && b.mac) : [];
        return l.sort((x, y) => lgNombreBascula(x).localeCompare(lgNombreBascula(y), 'es'));
    } catch(e){ return []; }
}
function lgNombreBascula(b){
    if (b && b.alias) return b.alias;
    const m = (b && b.mac) || '';
    return 'LevelGas ' + m.slice(-5).replace(':', '');
}
function basculasPedidas(){
    const q = new URLSearchParams(location.search).get('equipos');
    if (q){
        return q.split(',').map(s => s.trim().toUpperCase()).filter(Boolean)
                .map(mac => ({ mac, alias:'' }));
    }
    return lgBasculas();
}

/* ── Formato ─────────────────────────────────────────────────────────────── */
function fmtCorta(iso){
    const d = toChileDate(iso);
    return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth()+1) + ' ' +
           pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ── Consumo por día ─────────────────────────────────────────────────────────
   Se calcula aquí con _serieValida(), el mismo filtro del dashboard, en vez de
   leer public.sensor_daily_summary. Esa tabla existe y la mantiene un trabajo
   nocturno, pero es OTRA implementación de la misma idea y nadie la auditó
   —está anotada como pendiente en consumo-un-solo-algoritmo.md—. Un panel de
   empresa no es el lugar para estrenar una cuarta versión del número. */
function consumoPorDia(filas, tara, dias){
    const serie = _serieValida(filas, tara);           // fuera ceros, picos y valles
    const hoy   = toChileDate(new Date().toISOString());
    const clave = iso => { const d = toChileDate(iso);
        return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); };
    const ejes = [];
    for (let i = dias - 1; i >= 0; i--){
        const d = new Date(Date.UTC(hoy.getUTCFullYear(), hoy.getUTCMonth(), hoy.getUTCDate() - i));
        ejes.push(d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()));
    }
    const cubos = {}; ejes.forEach(k => cubos[k] = 0);
    /* Las filas llegan de la más nueva a la más vieja; se recorren al revés
       para que cada caída se cierre en el día correcto. */
    const asc = serie.slice().reverse();
    for (let i = 1; i < asc.length; i++){
        const a = _netoDe(asc[i-1], tara), b = _netoDe(asc[i], tara);
        if (a === null || b === null) continue;
        const baja = a - b;
        if (!(baja > 0)) continue;                      // una subida es recarga, no consumo
        const k = clave(asc[i].created_at);
        if (k in cubos) cubos[k] += baja;
    }
    return ejes.map(k => ({ dia:k, kg:+cubos[k].toFixed(3) }));
}

/* ── Dibujo ──────────────────────────────────────────────────────────────── */
function colorPct(p){ return p < 20 ? 'var(--red)' : p < 50 ? 'var(--orange)' : 'var(--green)'; }
function estadoPct(p){ return p < 20 ? ['Crítico','danger'] : p < 50 ? ['Atención','warn'] : ['Normal','ok']; }

function svgGauge(pct, mudo){
    const p   = Math.max(0, Math.min(100, Number(pct) || 0));
    const col = colorPct(p);
    const len = mudo ? 0 : (p / 100) * ARC;
    /* Con stroke-linecap:round un arco de largo CERO igual dibuja el casquete
       redondo del extremo. Quedaba un punto de color en el origen que parecia
       un indicador de posicion y no lo es: a 0 % no se dibuja el arco. */
    const relleno = len > 0
        ? '<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="' + col + '" '
        + 'stroke-width="15" stroke-linecap="round" stroke-dasharray="' + len + ' ' + ARC + '"/>'
        : '';
    return '<svg class="g-svg" viewBox="0 0 200 118" xmlns="http://www.w3.org/2000/svg">'
         + '<path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--bg3)" '
         + 'stroke-width="15" stroke-linecap="round"/>' + relleno
         + '</svg>';
}
function svgBarras(dias){
    const max = Math.max(0.001, ...dias.map(d => d.kg));
    const n = dias.length, w = 100 / n, hueco = w * 0.22;
    const barras = dias.map((d, i) => {
        const h = (d.kg / max) * 86;
        const x = i * w + hueco / 2, bw = w - hueco;
        const col = d.kg > 0 ? 'var(--primary)' : 'var(--border2)';
        const alto = d.kg > 0 ? Math.max(h, 2) : 2;
        return '<rect x="' + x.toFixed(2) + '" y="' + (92 - alto).toFixed(2) + '" '
             + 'width="' + bw.toFixed(2) + '" height="' + alto.toFixed(2) + '" '
             + 'rx="1" fill="' + col + '"><title>' + d.dia + ': '
             + d.kg.toFixed(2) + ' kg</title></rect>';
    }).join('');
    return '<svg viewBox="0 0 100 96" preserveAspectRatio="none" height="52" '
         + 'xmlns="http://www.w3.org/2000/svg">' + barras + '</svg>';
}
function chipBateria(v){
    const n = parseFloat(v);
    if (!Number.isFinite(n)) return '';
    const cls = n <= 3.70 ? 'c-bad' : n <= 3.90 ? 'c-warn' : 'c-ok';
    return '<span class="chip ' + cls + '"><i class="fas fa-battery-half"></i> ' + n.toFixed(2) + 'V</span>';
}
/* «Sin dato» a secas no distingue un wifi caído hace diez minutos de un equipo
   apagado hace dos meses, y para una flota esa es justo la diferencia que
   importa: la primera no se atiende, la segunda sí. */
function desdeUltimoReporte(iso){
    if (!iso) return null;
    const ms = Date.now() - _fechaUTC(iso).getTime();
    if (!Number.isFinite(ms) || ms < 0) return null;
    const h = ms / 3600000;
    return { ms, texto: h < 48 ? Math.round(h) + ' h' : Math.round(h / 24) + ' d' };
}
function chipUltimoReporte(iso){
    if (!iso) return '<span class="chip c-bad"><i class="fas fa-link-slash"></i> nunca reportó</span>';
    const d = desdeUltimoReporte(iso);
    if (!d || d.ms < SIN_REPORTE_AVISO_MS) return '';          // al día: sin ruido
    const cls = d.ms >= SIN_REPORTE_GRAVE_MS ? 'c-bad' : 'c-warn';
    return '<span class="chip ' + cls + '"><i class="fas fa-link-slash"></i> '
         + d.texto + ' sin reportar</span>';
}
/* El texto bajo el número cuando no hay ninguna lectura en la ventana. Dice
   DESDE CUÁNDO, no solo que falta: last_seen_at puede ser muy anterior a la
   ventana de 14 días del gráfico, que es el caso de un equipo retirado. */
function sinLecturasTxt(equipo){
    const iso = equipo && equipo.last_seen_at;
    if (!iso) return 'nunca reportó';
    const d = toChileDate(iso);
    return 'sin reportar desde el ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth()+1);
}
function chipSenal(rssi){
    const v = parseInt(rssi, 10);
    if (!Number.isFinite(v) || v >= 0 || v < -120) return '';
    const cls = v >= -67 ? 'c-ok' : v >= -75 ? 'c-warn' : 'c-bad';
    return '<span class="chip ' + cls + '"><i class="fas fa-wifi"></i> ' + v + '</span>';
}

function pintarTile(t){
    const { mac, nombre, error, tara, full, filas, ritmo, equipo } = t;
    if (error){
        return '<div class="tile" onclick="abrir(\'' + esc(mac) + '\')">'
             + '<div class="t-hdr"><div><div class="t-nom">' + esc(nombre) + '</div>'
             + '<div class="t-mac">' + esc(mac) + '</div></div></div>'
             + '<div class="aviso" style="border:none;box-shadow:none;padding:14px 4px">'
             + '<i class="fas fa-plug-circle-xmark"></i>' + esc(error) + '</div></div>';
    }
    /* Mismo criterio que el dashboard (p32): si lo que hay sobre la plataforma
       no llega a la tara, no hay gas que mostrar. */
    const vacia  = _bajoLaTara(filas, tara);
    const ultima = vacia ? filas[0] : (_ultimaValida(filas, tara) || filas[0]);
    const neto   = vacia ? 0 : _netoDe(ultima, tara);
    const mudo   = neto === null;
    const cap    = (full > tara) ? (full - tara) : 0;
    const pct    = (!mudo && cap > 0) ? (neto / cap) * 100 : 0;
    const [est, cls] = estadoPct(pct);

    const dias  = consumoPorDia(filas, tara, DIAS_GRAF);
    const total = dias.reduce((a, d) => a + d.kg, 0);
    const conDato = dias.filter(d => d.kg > 0).length;

    let pie;
    if (ritmo && ritmo.motivo === 'ok' && ritmo.kg_dia > 0 && !mudo && neto > 0){
        const d = neto / ritmo.kg_dia;
        pie = '<span>' + ritmo.kg_dia.toFixed(2) + ' kg/día</span>'
            + '<span class="' + (d < 3 ? 'danger' : d < 7 ? 'warn' : '') + '">~'
            + d.toFixed(1) + ' días restantes</span>';
    } else if (vacia){
        pie = '<span>Sin cilindro con gas sobre la balanza</span><span></span>';
    } else {
        pie = '<span>Ritmo no estimable</span><span></span>';
    }

    return '<div class="tile" onclick="abrir(\'' + esc(mac) + '\')" '
         + 'title="Abrir el dashboard de esta báscula">'
         + '<div class="t-hdr"><div><div class="t-nom">' + esc(nombre) + '</div>'
         + '<div class="t-mac">' + esc(mac) + '</div></div>'
         /* La fecha de la última LECTURA manda sobre devices.last_seen_at: es el
            dato que prueba que el equipo habló. Si last_seen_at viniera vacío
            —pasa, y es una columna que escribe otro camino— el recuadro decía
            «nunca reportó» en rojo junto a una medición de hace diez minutos.
            Sin lecturas en la ventana se cae a last_seen_at, que es justo el
            caso del equipo retirado hace meses. */
         + '<div class="t-chips">'
         + chipUltimoReporte((filas && filas[0] && filas[0].created_at) || equipo.last_seen_at)
         + chipBateria(equipo.battery_voltage)
         + chipSenal(equipo.last_rssi) + '</div></div>'
         + '<div class="visores">'
         +   '<div class="g-wrap">' + svgGauge(pct, mudo)
         +     '<div class="g-over">'
         +       '<div class="g-pct" style="color:' + (mudo ? 'var(--muted)' : colorPct(pct)) + '">'
         +         (mudo ? '—' : pct.toFixed(1) + '%') + '</div>'
         +       '<div class="g-est ' + (mudo ? '' : cls) + '">' + (mudo ? 'Sin dato' : est) + '</div>'
         +     '</div></div>'
         +   '<div class="digital"><div class="d-lbl">Peso neto</div>'
         +     '<div class="d-num' + (mudo ? ' mudo' : '') + '">'
         +       (mudo ? 'sin dato' : neto.toFixed(2) + '<small>kg</small>') + '</div>'
         +     '<div class="d-sub">' + (ultima ? fmtCorta(ultima.created_at) : sinLecturasTxt(equipo)) + '</div>'
         +   '</div>'
         + '</div>'
         + '<div class="graf"><div class="graf-hdr">'
         +   '<span class="graf-lbl">Consumo diario · ' + DIAS_GRAF + ' días</span>'
         +   '<span class="graf-med">' + total.toFixed(1) + ' kg en ' + conDato + ' días</span>'
         + '</div>' + svgBarras(dias)
         + '<div class="graf-pie">' + pie + '</div></div>'
         + '</div>';
}

/* ── Datos ───────────────────────────────────────────────────────────────── */
async function datosDe(b){
    const base = { mac:b.mac, nombre: lgNombreBascula(b) };
    const { data: eq, error } = await db.from('devices')
        .select('device_id,device_mac,empty_weight,full_weight,plan,battery_voltage,last_rssi,last_seen_at')
        .eq('device_mac', b.mac).maybeSingle();
    if (error)  return { ...base, error:'No se pudo consultar (' + (error.code || 'red') + ')' };
    if (!eq)    return { ...base, error:'Esta MAC no está registrada' };
    base.nombre = b.alias || lgNombreBascula(b);
    const tara = parseFloat(eq.empty_weight) || 0;
    const full = parseFloat(eq.full_weight)  || 0;
    /* Una consulta por báscula y no una sola con .in(): con un límite común, un
       equipo callado desde hace días se queda sin filas porque las de los otros
       llenan el cupo. Son cuatro consultas chicas. */
    const { data: filas } = await db.from('sensor_data')
        .select('weight,empty_weight,created_at,cycle_id')
        .eq('device_id', eq.device_id)
        .gte('created_at', new Date(Date.now() - (DIAS_GRAF + 1) * 86400000).toISOString())
        .order('created_at', { ascending:false }).limit(400);
    let ritmo = null;
    try {
        const { data: r } = await db.rpc('consumo_ritmo', { p_device_id: eq.device_id });
        ritmo = Array.isArray(r) ? r[0] : r;
    } catch(e){ console.warn('[ritmo]', b.mac, e); }
    return { ...base, equipo:eq, tara, full, filas: filas || [], ritmo };
}

function avisoHtml(ico, txt){
    return '<div class="aviso"><i class="fas ' + ico + '"></i>' + txt + '</div>';
}

async function cargar(){
    const cont = document.getElementById('contenido');
    const lista = basculasPedidas().slice(0, MAX_TILES);
    if (!lista.length){
        cont.innerHTML = avisoHtml('fa-layer-group',
            'Todavía no hay básculas en este navegador.<br>Abre cada una por su código QR una vez, '
          + 'o entra con <b>?equipos=MAC1,MAC2</b> en la dirección.');
        return;
    }
    const tiles = await Promise.all(lista.map(datosDe));
    /* La puerta del plan: el panel es del plan empresa. Si ninguna de las
       básculas lo tiene, no se muestra — pero el mensaje dice qué es, porque
       una pantalla en blanco parece una falla. */
    const hayEmpresa = tiles.some(t => t.equipo && t.equipo.plan === 'empresa');
    if (!hayEmpresa){
        cont.innerHTML = avisoHtml('fa-lock',
            'El panel con varios cilindros en una pantalla es parte del <b>plan empresa</b>.<br>'
          + 'Cada báscula se sigue viendo entera desde su propio dashboard.');
        return;
    }
    cont.innerHTML = '<div class="rejilla n' + tiles.length + '">'
                   + tiles.map(pintarTile).join('') + '</div>';
    const d = new Date();
    document.getElementById('sello').textContent =
        'Actualizado ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function abrir(mac){ location.href = 'index.html?device=' + encodeURIComponent(mac); }
function cambiarTema(){
    const claro = document.documentElement.dataset.theme === 'light';
    document.documentElement.dataset.theme = claro ? 'dark' : 'light';
    document.getElementById('ico-tema').className = claro ? 'fas fa-sun' : 'fas fa-moon';
    try { localStorage.setItem('lg_panel_tema', claro ? 'dark' : 'light'); } catch(e){}
}
(function arranque(){
    try {
        const t = localStorage.getItem('lg_panel_tema');
        if (t){ document.documentElement.dataset.theme = t;
                document.getElementById('ico-tema').className =
                    t === 'light' ? 'fas fa-moon' : 'fas fa-sun'; }
    } catch(e){}
    cargar();
    setInterval(cargar, REFRESCO_MS);
})();
</script>
